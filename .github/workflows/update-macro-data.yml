name: Build and deploy verified macro data
on:
  workflow_dispatch:
  schedule:
    - cron: '21 6 1 * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - name: Download and validate World Bank / UN / IMF / OECD data
        run: python scripts/build_dataset.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public web assets
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js _site/
          cp -R icons data _site/
          cp macro_50_2026_anchors.csv _site/
      - name: Upload complete PWA and sourced data
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
